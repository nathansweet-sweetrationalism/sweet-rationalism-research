name: Dietz article source-check fixture self-tests

on:
  push:
    paths:
      - 'articles/joel-dietz-audit-nathan-sweet-bubble-sort-response/**'
      - '.github/workflows/dietz-source-checks.yml'
      - 'scripts/bottom_line_gate.py'
      - 'tests/test_bottom_line_gate.py'
      - 'docs/ARTICLE_QUALITY_GATES.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fixture-only checks (NOT primary-source verification)
        shell: bash
        working-directory: articles/joel-dietz-audit-nathan-sweet-bubble-sort-response
        run: |
          set -euo pipefail
          python --version
          for test in validator xenobot tadpole score ports authorship doi; do
            echo "Fixture smoke test: $test"
            python audit.py --selftest --config "test-data/$test.json"
          done

      - name: Opening metadata and Bottom line regression tests
        run: python3 -m unittest discover -s tests -p test_bottom_line_gate.py -v
      - name: Verify MailPoet deep links and collapsed panels
        run: python3 -m unittest discover -s tests -p test_mailpoet_deep_links.py -v
      - name: Actual published article opening-order gate
        run: python3 scripts/bottom_line_gate.py articles/joel-dietz-audit-nathan-sweet-bubble-sort-response/article.html --json
